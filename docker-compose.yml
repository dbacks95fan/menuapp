# No top-level `name:` — the Synology DiskStation's bundled docker-compose
# (v1.28.x) rejects it. The project name is set with `-p mealflow` at the CLI;
# the container is named explicitly below.
services:
  app:
    build: .
    image: mealflow:latest
    container_name: mealflow
    ports:
      - "${HTTP_PORT:-4000}:4000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
